; CYD 2432S028 SD Launcher — bare bones JSON loader + game booter
; Display: ILI9341 320x240 landscape (same config as Frank/Invaders projects)
; SD: VSPI MOSI 23, MISO 19, SCK 18, CS 5
; USB serial: /dev/ttyUSB0 115200

[env:cyd-2432s028]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_port = /dev/ttyUSB0
upload_port = /dev/ttyUSB0
upload_speed = 921600

; OTA partition layout (required for flashing .bin files from SD)
board_build.partitions = default.csv
board_build.f_cpu = 240000000L
board_build.flash_mode = dio

build_flags =
  -O2
  -DCORE_DEBUG_LEVEL=0
  -DLGFX_USE_V1
  -DTFT_BL=21

lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  bblanchon/ArduinoJson@^7.4.2
